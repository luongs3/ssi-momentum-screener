<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SignalCourt — On-Chain Claim Verifier</title>
<style>
  :root{--bg:#0a0e1a;--card:#0f1628;--border:#1e2d4f;--accent:#5a9eff;--green:#50c878;--red:#e05050;--orange:#f5a623;--purple:#b08cff;--gray:#7a8aa0;--white:#e8eaf2;font-family:ui-monospace,'JetBrains Mono','Fira Code',monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--white);min-height:100vh;padding:0}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px}
  header h1{font-size:1.1rem;color:var(--accent);letter-spacing:.03em}
  header span{font-size:.75rem;color:var(--gray)}
  .badge{padding:3px 10px;border-radius:4px;font-size:.7rem;border:1px solid;margin-left:auto}
  .badge.idle{border-color:var(--gray);color:var(--gray)}
  .badge.running{border-color:var(--accent);color:var(--accent);animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  main{display:grid;grid-template-columns:1fr 380px;gap:1px;height:calc(100vh - 57px);overflow:hidden}
  .panel{background:var(--card);border:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
  .panel-title{padding:10px 16px;font-size:.7rem;color:var(--gray);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--border);flex-shrink:0}
  .panel-body{overflow-y:auto;flex:1;padding:12px}
  .panel-body::-webkit-scrollbar{width:4px}
  .panel-body::-webkit-scrollbar-thumb{background:var(--border)}

  /* Docket cards */
  .claim-card{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:10px}
  .claim-card .header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .claim-card .agent{font-size:.8rem;color:var(--white);font-weight:600}
  .claim-card .meta{font-size:.7rem;color:var(--gray)}
  .claim-card .direction{font-size:.7rem;padding:2px 8px;border-radius:3px;font-weight:700}
  .direction.LONG{background:#1a3320;color:var(--green);border:1px solid var(--green)}
  .direction.SHORT{background:#331a1a;color:var(--red);border:1px solid var(--red)}
  .verdict-badge{margin-left:auto;font-size:.7rem;padding:3px 10px;border-radius:4px;font-weight:700;letter-spacing:.05em}
  .verdict-badge.CONFIRMED{background:#1a3320;color:var(--green);border:1px solid var(--green)}
  .verdict-badge.DISPUTED{background:#331a1a;color:var(--red);border:1px solid var(--red)}
  .verdict-badge.UNPROVABLE{background:#2a2520;color:var(--orange);border:1px solid var(--orange)}
  .verdict-badge.AUDITING{background:#1a2240;color:var(--accent);border:1px solid var(--accent)}
  .evidence{font-size:.7rem;color:var(--gray);margin-top:6px;border-top:1px solid var(--border);padding-top:6px}
  .evidence span{color:var(--white)}

  /* Thought stream */
  .thought{padding:6px 0;border-bottom:1px solid rgba(30,45,79,.4);font-size:.72rem;line-height:1.5}
  .thought .phase{font-weight:700;margin-right:6px}
  .thought .phase.INGEST{color:var(--accent)}
  .thought .phase.SOSOVALUE_NEWS{color:var(--purple)}
  .thought .phase.SSI_INDEX{color:var(--orange)}
  .thought .phase.SODEX_PRICE{color:var(--green)}
  .thought .phase.VERDICT{color:var(--white)}
  .verdict-full{padding:12px;background:var(--bg);border-radius:6px;border:1px solid var(--border);margin-top:8px}

  /* Submit form */
  .submit-form{padding:12px;border-top:1px solid var(--border);flex-shrink:0}
  .submit-form h3{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--gray);margin-bottom:8px}
  .form-row{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
  select,input{background:var(--bg);color:var(--white);border:1px solid var(--border);border-radius:4px;padding:5px 8px;font-size:.75rem;font-family:inherit;flex:1;min-width:80px}
  button{background:var(--accent);color:#000;border:none;padding:6px 14px;border-radius:4px;font-size:.75rem;font-weight:700;cursor:pointer;font-family:inherit}
  button:hover{filter:brightness(1.1)}
  button.demo{background:var(--border);color:var(--gray)}
  button.demo:hover{background:var(--gray);color:var(--bg)}
  .kpi-row{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
  .kpi{text-align:center;flex:1}
  .kpi .val{font-size:1.2rem;font-weight:700;color:var(--accent)}
  .kpi .lbl{font-size:.6rem;color:var(--gray);text-transform:uppercase;letter-spacing:.06em}
</style>
</head>
<body>
<header>
  <h1>⚖ SignalCourt</h1>
  <span>On-chain claim verifier for SoSoValue-data-backed signals — WaveHack Wave 3</span>
  <div class="badge idle" id="statusBadge">IDLE</div>
</header>
<main>
  <!-- LEFT: Audit docket -->
  <div style="display:flex;flex-direction:column;overflow:hidden">
    <div class="kpi-row" id="kpis">
      <div class="kpi"><div class="val" id="kpiTotal">0</div><div class="lbl">Claims Audited</div></div>
      <div class="kpi"><div class="val" style="color:var(--green)" id="kpiConfirmed">0</div><div class="lbl">Confirmed</div></div>
      <div class="kpi"><div class="val" style="color:var(--red)" id="kpiDisputed">0</div><div class="lbl">Disputed</div></div>
      <div class="kpi"><div class="val" style="color:var(--orange)" id="kpiUnprovable">0</div><div class="lbl">Unprovable</div></div>
    </div>
    <div class="panel" style="flex:1">
      <div class="panel-title">Audit Docket — verified claims</div>
      <div class="panel-body" id="docket"></div>
    </div>
    <!-- Submit -->
    <div class="submit-form">
      <h3>Submit a claim for audit</h3>
      <div class="form-row">
        <input id="claimAgent" placeholder="Agent name" value="My Trading Agent">
        <select id="claimSymbol">
          <option value="vBTC_vUSDC">BTC/USDC</option>
          <option value="vETH_vUSDC">ETH/USDC</option>
          <option value="vSOL_vUSDC">SOL/USDC</option>
        </select>
        <select id="claimDir"><option value="LONG">LONG</option><option value="SHORT">SHORT</option></select>
        <select id="claimBasis"><option value="NEWS">NEWS</option><option value="INDEX">INDEX</option><option value="BOTH">BOTH</option></select>
      </div>
      <div class="form-row">
        <input id="claimCurrency" placeholder="Currency e.g. BTC" value="BTC">
        <button onclick="submitClaim()">▶ Audit Claim</button>
        <button class="demo" onclick="runDemo(0)">Demo #1</button>
        <button class="demo" onclick="runDemo(1)">Demo #2</button>
      </div>
    </div>
  </div>

  <!-- RIGHT: Thought stream -->
  <div style="display:flex;flex-direction:column;overflow:hidden">
    <div class="panel" style="flex:1">
      <div class="panel-title">Agent Thought-Stream — live audit trace</div>
      <div class="panel-body" id="thoughts"></div>
    </div>
    <div class="panel" style="height:120px">
      <div class="panel-title">Receipt Chain</div>
      <div class="panel-body" style="font-size:.7rem" id="receipts">Loading...</div>
    </div>
  </div>
</main>

<script>
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let docket=[], receipts=0, chainOk=true;

function updateKPIs(){
  document.getElementById('kpiTotal').textContent=docket.length;
  document.getElementById('kpiConfirmed').textContent=docket.filter(d=>d.verdict==='CONFIRMED').length;
  document.getElementById('kpiDisputed').textContent=docket.filter(d=>d.verdict==='DISPUTED').length;
  document.getElementById('kpiUnprovable').textContent=docket.filter(d=>d.verdict==='UNPROVABLE').length;
}

function renderDocket(){
  const el=document.getElementById('docket');
  el.innerHTML=docket.map(d=>{
    const ev=d.evidence||{};
    const newsSent=ev.news?ev.news.sentiment:'—';
    const idxSent=ev.indexSignal||'—';
    const sodexPx=ev.sodex?ev.sodex.lastPx:'—';
    return`<div class="claim-card">
      <div class="header">
        <span class="agent">${esc(d.agent)}</span>
        <span class="direction ${esc(d.direction)}">${esc(d.direction)}</span>
        <span class="meta">${esc(d.symbol)}</span>
        <span class="verdict-badge ${esc(d.verdict)}">${esc(d.verdict)}</span>
      </div>
      <div class="evidence">
        SoSoValue News: <span>${esc(newsSent)}</span> &nbsp;·&nbsp;
        SSI Index: <span>${esc(idxSent)}</span> &nbsp;·&nbsp;
        SoDEX price: <span>${esc(sodexPx)}</span>
        ${d.warnings&&d.warnings.length?'<br>⚠ '+d.warnings.map(esc).join('; '):''}
      </div>
    </div>`;
  }).join('')||'<div style="color:var(--gray);font-size:.75rem;padding:20px 0 0">No claims audited yet. Submit a claim or run a demo.</div>';
  updateKPIs();
}

function addThought(phase, msg){
  const el=document.getElementById('thoughts');
  el.innerHTML+=`<div class="thought"><span class="phase ${esc(phase)}">[${esc(phase)}]</span>${esc(msg)}</div>`;
  el.scrollTop=el.scrollHeight;
}

function updateStatus(running){
  const badge=document.getElementById('statusBadge');
  badge.className='badge '+(running?'running':'idle');
  badge.textContent=running?'AUDITING':'IDLE';
}

async function loadState(){
  const r=await fetch('/api/state');
  const d=await r.json();
  docket=d.docket||[];
  renderDocket();
  updateStatus(d.running);
}

async function loadReceipts(){
  const r=await fetch('/api/receipts');
  const d=await r.json();
  receipts=d.receipts.length;
  chainOk=d.verify.ok;
  const el=document.getElementById('receipts');
  el.innerHTML=`${receipts} entries &nbsp;·&nbsp; Chain: <span style="color:${chainOk?'var(--green)':'var(--red)'}">${chainOk?'INTACT':'BROKEN'}</span>`;
}

// SSE
const es=new EventSource('/events');
es.addEventListener('state',e=>{
  const d=JSON.parse(e.data);
  if(d.docket){docket=d.docket; renderDocket();}
  updateStatus(d.running);
});
es.addEventListener('step',e=>{
  const d=JSON.parse(e.data);
  addThought(d.step,d.msg);
});
es.addEventListener('verdict',e=>{
  const d=JSON.parse(e.data);
  // update or add to docket
  const idx=docket.findIndex(x=>x.claimId===d.claimId);
  if(idx>=0)docket[idx]=d; else docket.unshift(d);
  renderDocket();
  loadReceipts();
  const el=document.getElementById('thoughts');
  el.innerHTML+=`<div class="verdict-full">
    <div style="font-size:.8rem;font-weight:700;color:${d.verdict==='CONFIRMED'?'var(--green)':d.verdict==='DISPUTED'?'var(--red)':'var(--orange)'}">
      Verdict: ${esc(d.verdict)}
    </div>
    <div style="font-size:.7rem;color:var(--gray);margin-top:4px">Claim ${esc(d.claimId)} · ${new Date(d.auditedAt).toLocaleTimeString()}</div>
  </div>`;
  el.scrollTop=el.scrollHeight;
});
es.addEventListener('error',e=>{
  const d=JSON.parse(e.data||'{}');
  addThought('ERROR',d.msg||'unknown error');
});

async function submitClaim(){
  const claim={
    agent:document.getElementById('claimAgent').value||'My Agent',
    symbol:document.getElementById('claimSymbol').value,
    direction:document.getElementById('claimDir').value,
    signal_basis:document.getElementById('claimBasis').value,
    currency:document.getElementById('claimCurrency').value,
  };
  document.getElementById('thoughts').innerHTML='';
  addThought('SUBMIT','Submitting claim for audit...');
  await fetch('/api/claims',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(claim)});
}

async function runDemo(idx){
  document.getElementById('thoughts').innerHTML='';
  addThought('DEMO','Loading demo claim #'+(idx+1)+'...');
  await fetch('/api/audit-demo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index:idx})});
}

loadState();
loadReceipts();
</script>
</body>
</html>
